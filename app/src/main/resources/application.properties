# ===============================
# DATASOURCE (configured via environment variables)
# ===============================

# Values are taken from environment variables.
# Defaults are provided for local development (IDE run).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}


# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate


# ===============================
# LIQUIBASE
# ===============================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:changelog/master.yml


# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always


# ===============================
# SECURITY
# ===============================
# JWT secret can be overridden via environment variable
token.signing.key=${JWT_SECRET:2ISC2VL5vm45TU5M81cPRQKiUev49FUDF9n3WK2ahoQ=}


# ===============================
# LOGGING
# ===============================

# Root logger
logging.level.root=INFO

# Spring Security debug (useful when investigating 403 errors)
logging.level.org.springframework.security=DEBUG

# JWT logging
logging.level.io.jsonwebtoken=DEBUG

# Spring Web logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=DEBUG

# Hibernate SQL logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Application logging
logging.level.com.example=DEBUG

# Log patterns
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log file settings
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=10